bind -n M-v split-window -v
bind -n M-h split-window -h

bind -n M-t new-window

bind -n M-r source-file ~/.config/tmux/tmux.conf


bind -n M-w run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' session manager ' --prompt '⚡  ' \
    --header 'a:all t:tmux g:configs x:zoxide d:kill k:killall' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..}; ~/.tmux/plugins/tmux-resurrect/scripts/save.sh)+change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-k:execute(rm ~/.config/tmux/resurrect/* -rf)+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""
set -g detach-on-destroy off

# n and p to switch windows
bind -n M-, previous-window\; refresh-client -S
bind -n M-. next-window\; refresh-client -S

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 0

bind -n M-d detach
bind -n M-x kill-pane 

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'


# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'erikw/tmux-powerline'

set -g @plugin 'wfxr/tmux-power'
set -g @tmux_power_theme 'colour4'
set -g @tmux_power_date_format '%D'
set -g status-position top

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'         # auto-restore on tmux start
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-dir       '~/.config/tmux/resurrect'
set -g @continuum-save-dir  '~/.config/tmux/resurrect'
set -g @continuum-save-interval '1'   # save every 15 minutes

# Hook into continuum auto-save and log the save directory
set-hook -g @continuum-save 'run-shell "echo [tmux-continuum] saved to: #{@@resurrect-dir:-~/.tmux/resurrect} >> ~/.config/tmux/continuum.log"'

run '~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux'
run '~/.config/tmux/plugins/tmux-continuum/continuum.tmux'



# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


# Enable xterm-keys for detecting Alt + Arrows
set -g xterm-keys on

# Alt + Left
bind -n M-Left if-shell '[ "$(tmux display -p "#{pane_at_left}")" -eq 1 ]' \
  'previous-window' \
  'select-pane -L'

# Alt + Right
bind -n M-Right if-shell '[ "$(tmux display -p "#{pane_at_right}")" -eq 1 ]' \
  'next-window' \
  'select-pane -R'

# Optional: Alt + Up and Down (can modify or remove if not needed)
bind -n M-Up if-shell '[ "$(tmux display -p "#{pane_at_top}")" -eq 1 ]' \
  'select-window -t:-' \
  'select-pane -U'

bind -n M-Down if-shell '[ "$(tmux display -p "#{pane_at_bottom}")" -eq 1 ]' \
  'select-window -t:+' \
  'select-pane -D'



